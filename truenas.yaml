# Studydeck — TrueNAS SCALE compose
# Place at /mnt/tank/apps/studydeck/truenas.yaml (or any apps dir).
# Image: ghcr.io/l385-glitch/studydeck:main (built by GitHub Actions on every push)
name: studydeck

services:
  studydeck:
    image: ghcr.io/l385-glitch/studydeck:main
    container_name: studydeck
    restart: unless-stopped
    ports:
      - "3355:8000"
    environment:
      # Your llama.cpp endpoint on the TrueNAS box (host-gateway = the NAS itself)
      LLM_BASE_URL: http://100.99.134.99:9293
      LLM_MODEL: Qwen3.8-27B-Q4
      LLM_API_KEY: not-needed
      # Optional: cap cards per document (default 200)
      # MAX_CARDS_PER_DOC: "200"
    volumes:
      - /mnt/tank/apps/studydeck/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
